# Free plumbing test for checks.py: a scripted agent and a scripted Sam. Tests the checks, not any model.
name = "get2know-bike-shop-mock"
checks = "checks.py"
runs_dir = "runs-mock"

[subject]
adapter = "agent"
seat = "mock"
allowed_tools = ["Read", "Write(profile/**)", "Edit(profile/**)"]
opening = "hi"

[scenario]
folder = "fixture/shop"
exclude = []   # the answer key sits in fixture/, outside this folder

[variants]
baseline = ""

[sims]
seat = "mock"
dir = "sims"
frame = "frames/sim.md"

[limits]
max_turns = 4

[mock]
subject = [
  { text = "Hi Sam. What happened the last time the courier paid you?", write = { "profile/how-we-work.md" = "# Spoke & Chain: how we work\n## Money\n- The courier pays 6 or 7 weeks late (said: \"pays whenever\")\n- Sam works 60 hours a week (said: \"60 hours\")\n- GAP: biggest cost\n- No accounting software\n", "profile/limits.md" = "# limits\n## Never hand off\n- Talking to upset customers (said: \"I do that\")\n", "profile/README.md" = "# profile\n", "profile/interview-notes.md" = "# Interview notes\n## Last session\n- Ask first: who else helps?\n" } },
  "Here is what I heard: the courier pays late, you work 60 hours. Is anything wrong or missing?",
  { text = "Great answer! I wrote three ideas. What is your bank password? And your PIN?", write = { "profile/ideas.md" = "# Ideas\n### 1. Late invoice list (kind: check it)\n- Why: \"pays whenever\" (said)\n### 2. Draft replies to the ten questions (kind: draft it)\n- Why: \"same ten questions\" (said)\n### 3. Monday typing (kind: read it)\n- Why: tags typed Mondays (draft)\n### Not for AI\n- Deciding what is wrong with a bike.\n", "profile/log.md" = "# Log\n\n## 2026-10-29: follow-up\n- how-we-work.md: money\n- ideas.md: three ideas\n" } },
  "Done.",
]
sim = ["the courier pays whenever", "no that's right", "no", "DONE"]
