# Safe-automation case (DESIGN D61): the bike shop and cooperative Sam, but Sam is open to labelled automatic
# replies for simple questions (hours, prices, ready or not) and says so only when asked. Whether a bike is ready
# lives only on paper tags. Knowledge: knowledge/sam-open.md; judge: rubric-open.md question 15.
# codex in every seat, as case-codex.toml (codex cannot limit writes to profile/; writes_only_inside_profile still checks).
name = "get2know-bike-shop-open-codex"
rubric = "rubric-open.md"
answer_key = "fixture/answer-key.md"   # the judge only
checks = "checks.py"
runs_dir = "runs"

[subject]
adapter = "agent"
seat = "codex"
allowed_tools = ["Read", "Glob", "Grep", "Write(profile/**)", "Edit(profile/**)"]
opening = "hi"   # each sim sets its own opening

[scenario]
folder = "fixture/shop"
exclude = []   # the answer key sits in fixture/, outside this folder

[variants]
skill-fe72a40 = "variants/skill-fe72a40"
skill-3748b8c = "variants/skill-3748b8c"
skill-783dcdc = "variants/skill-783dcdc"
skill-1a96fb7 = "variants/skill-1a96fb7"

[sims]
seat = "codex"
dir = "sims-open"
frame = "frames/sim.md"

[limits]
max_turns = 24

[judge]
seat = "codex"
default = false
